<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" shape-rendering="crispEdges">
  <rect width="960" height="320" fill="#0B1220"/>
  <rect width="960" height="16" fill="#12304A"/>
  <rect y="16" width="960" height="4" fill="#7FDBDA"/>
  <rect y="296" width="960" height="24" fill="#0E1C30"/>
  <g fill="#1B6B6B">
    <rect x="64" y="232" width="8" height="64"/><rect x="72" y="248" width="8" height="48"/>
    <rect x="160" y="240" width="8" height="56"/><rect x="168" y="256" width="8" height="40"/>
    <rect x="760" y="236" width="8" height="60"/><rect x="768" y="252" width="8" height="44"/>
    <rect x="848" y="240" width="8" height="56"/><rect x="856" y="256" width="8" height="40"/>
  </g>
  <g fill="#FF8FB8">
    <rect x="880" y="288" width="8" height="8"/>
    <rect x="872" y="296" width="8" height="8"/>
    <rect x="888" y="296" width="8" height="8"/>
  </g>
  <text x="480" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="56" font-weight="700" fill="#FF8FB8">sakana</text>
  <text x="480" y="182" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#C9D6D5">just a fish</text>
  <rect x="140" y="240" width="4" height="4" fill="#E8F4F2"><animate attributeName="y" values="260;40" dur="3.2s" repeatCount="indefinite"/></rect>
  <rect x="300" y="240" width="4" height="4" fill="#E8F4F2"><animate attributeName="y" values="270;36" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="640" y="240" width="4" height="4" fill="#E8F4F2"><animate attributeName="y" values="255;48" dur="3.6s" repeatCount="indefinite"/></rect>
  <rect x="800" y="240" width="4" height="4" fill="#E8F4F2"><animate attributeName="y" values="265;42" dur="4.4s" repeatCount="indefinite"/></rect>
  <defs>
    <g id="fishR">
      <g fill="#E05A8A">
        <rect x="48" y="0" width="40" height="8"/><rect x="32" y="8" width="16" height="8"/><rect x="88" y="8" width="16" height="8"/>
        <rect x="24" y="16" width="8" height="8"/><rect x="104" y="16" width="16" height="8"/>
        <rect x="16" y="24" width="8" height="8"/><rect x="112" y="24" width="16" height="8"/>
        <rect x="8" y="32" width="8" height="8"/><rect x="120" y="32" width="8" height="8"/>
        <rect x="16" y="40" width="8" height="8"/><rect x="104" y="40" width="16" height="8"/>
        <rect x="24" y="48" width="8" height="8"/><rect x="104" y="48" width="16" height="8"/>
        <rect x="32" y="56" width="16" height="8"/><rect x="88" y="56" width="16" height="8"/>
        <rect x="48" y="64" width="40" height="8"/>
      </g>
      <g fill="#FF8FB8">
        <rect x="48" y="8" width="40" height="8"/><rect x="32" y="16" width="72" height="8"/>
        <rect x="24" y="24" width="80" height="8"/><rect x="16" y="32" width="104" height="8"/>
        <rect x="24" y="40" width="80" height="8"/><rect x="32" y="48" width="72" height="8"/>
        <rect x="48" y="56" width="40" height="8"/>
      </g>
      <rect x="56" y="24" width="24" height="24" fill="#FFC4D6"/>
      <rect x="104" y="24" width="8" height="8" fill="#E8F4F2"/>
    </g>
    <g id="fishL">
      <use href="#fishR" transform="translate(128,0) scale(-1,1)"/>
    </g>
  </defs>
  <g transform="translate(80,208)">
    <use href="#fishR">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;1;0;0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" values="0,0; 710,0; 710,0; 0,0"/>
    </use>
    <use href="#fishL">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;1;1;1;0;0"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" values="0,0; 710,0; 710,0; 0,0"/>
    </use>

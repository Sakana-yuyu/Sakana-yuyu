<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" shape-rendering="crispEdges">
  <rect width="960" height="320" fill="#0B1220"/>
  <rect y="0" width="960" height="20" fill="#12304A"/>
  <rect y="20" width="960" height="8" fill="#7FDBDA"/>
  <rect y="292" width="960" height="28" fill="#0E1C30"/>
  <g fill="#1B6B6B">
    <rect x="64" y="220" width="8" height="72"/><rect x="72" y="236" width="8" height="56"/>
    <rect x="168" y="232" width="8" height="60"/><rect x="176" y="248" width="8" height="44"/>
    <rect x="760" y="224" width="8" height="68"/><rect x="768" y="240" width="8" height="52"/>
    <rect x="868" y="228" width="8" height="64"/><rect x="876" y="244" width="8" height="48"/>
  </g>
  <g fill="#FF8FB8">
    <rect x="832" y="276" width="8" height="8"/><rect x="824" y="284" width="8" height="8"/>
    <rect x="840" y="284" width="8" height="8"/><rect x="832" y="292" width="8" height="8"/>
  </g>
  <text x="480" y="150" text-anchor="middle" font-family="monospace" font-size="52" font-weight="700" fill="#FF8FB8">sakana</text>
  <text x="480" y="186" text-anchor="middle" font-family="monospace" font-size="18" fill="#E8F4F2">just a fish</text>
  <g>
    <g id="fish">
      <rect x="0" y="8" width="8" height="24" fill="#E05A8A"/>
      <rect x="8" y="4" width="16" height="32" fill="#FF8FB8"/>
      <rect x="24" y="0" width="32" height="40" fill="#FF8FB8"/>
      <rect x="28" y="12" width="16" height="16" fill="#FFC4D6"/>
      <rect x="48" y="12" width="8" height="8" fill="#E8F4F2"/>
      <rect x="56" y="8" width="8" height="24" fill="#E05A8A"/>
    </g>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" path="M 80,210 C 220,80 420,260 560,120 C 700,40 820,220 880,160 C 820,80 640,250 400,90 C 220,40 120,240 80,210 Z"/>
  </g>
  <g fill="#E8F4F2">
    <rect x="120" y="80" width="4" height="4"><animate attributeName="y" values="240;40" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="300" y="80" width="4" height="4"><animate attributeName="y" values="260;30" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="640" y="80" width="4" height="4"><animate attributeName="y" values="250;50" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="800" y="80" width="4" height="4"><animate attributeName="y" values="270;35" dur="4.4s" repeatCount="indefinite"/></rect>
  </g>
